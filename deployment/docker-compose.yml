# SunChat Docker Compose 配置
# 使用本地已部署的 Ollama（主机网络模式）

version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_API_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_API_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - DATABASE_URL=sqlite:///./data/sunchat.db
      - CHROMA_PERSIST_DIR=./data/chroma
    volumes:
      - ./backend_data:/app/data
    networks:
      - sunchat-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sunchat-network
    restart: unless-stopped

networks:
  sunchat-network:
    driver: bridge
